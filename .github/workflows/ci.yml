name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build reproducible demo warehouse
        run: python -m scripts.build_demo

      - name: Run data quality and application tests
        run: python -m pytest models/data_quality.py tests -q

      - name: Compile Python sources
        run: python -m compileall analysis dashboard ingestion models scripts simulation streamlit_app.py
